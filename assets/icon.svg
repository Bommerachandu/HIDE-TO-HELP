<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#bg)" filter="url(#glow)"/>
  
  <!-- Network/neural pattern -->
  <g stroke="#fff" stroke-width="1.5" fill="none" opacity="0.9">
    <!-- Central node -->
    <circle cx="32" cy="32" r="6" fill="#fff" opacity="0.2"/>
    <circle cx="32" cy="32" r="6" stroke="#fff" stroke-width="2"/>
    
    <!-- Connected nodes -->
    <circle cx="14" cy="18" r="4" fill="#fff" opacity="0.3"/>
    <circle cx="50" cy="18" r="4" fill="#fff" opacity="0.3"/>
    <circle cx="14" cy="46" r="4" fill="#fff" opacity="0.3"/>
    <circle cx="50" cy="46" r="4" fill="#fff" opacity="0.3"/>
    
    <!-- Connections -->
    <line x1="32" y1="26" x2="18" y2="22" stroke-width="1.5"/>
    <line x1="32" y1="26" x2="46" y2="22" stroke-width="1.5"/>
    <line x1="32" y1="38" x2="18" y2="42" stroke-width="1.5"/>
    <line x1="32" y1="38" x2="46" y2="42" stroke-width="1.5"/>
    
    <!-- Outer ring segments -->
    <path d="M32 6 C20 6 10 16 10 28" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M32 6 C44 6 54 16 54 28" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M32 58 C20 58 10 48 10 36" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M32 58 C44 58 54 48 54 36" stroke-width="1" stroke-dasharray="4 4"/>
  </g>
  
  <!-- Pulsing center (animated via CSS in app) -->
  <circle cx="32" cy="32" r="3" fill="#fff" opacity="0.8">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>